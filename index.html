<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Venus | En desarrollo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg1:#0f172a;
    --bg2:#111827;
    --card:rgba(255,255,255,0.06);
    --border:rgba(255,255,255,0.08);
    --text:#f8fafc;
    --muted:#94a3b8;
    --accent:#38bdf8;
}

body{
    min-height:100vh;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:
        radial-gradient(circle at top right, rgba(56,189,248,.18), transparent 35%),
        radial-gradient(circle at bottom left, rgba(99,102,241,.16), transparent 30%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
    color:var(--text);
}

.box{
    width:100%;
    max-width:520px;
    background:var(--card);
    border:1px solid var(--border);
    backdrop-filter:blur(14px);
    border-radius:22px;
    padding:42px 32px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
    height:58px;
    width:auto;
    margin-bottom:26px;
    object-fit:contain;
}

.badge{
    display:inline-block;
    padding:8px 14px;
    border-radius:999px;
    font-size:13px;
    letter-spacing:.4px;
    background:rgba(56,189,248,.12);
    color:#7dd3fc;
    margin-bottom:18px;
}

h1{
    font-size:clamp(28px,5vw,42px);
    font-weight:700;
    margin-bottom:14px;
}

p{
    color:var(--muted);
    font-size:16px;
    line-height:1.6;
}

.date{
    margin-top:26px;
    font-size:14px;
    color:#cbd5e1;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,.06);
}

.loader{
    width:72px;
    height:4px;
    background:rgba(255,255,255,.08);
    margin:28px auto 0;
    border-radius:999px;
    overflow:hidden;
}

.loader span{
    display:block;
    height:100%;
    width:40%;
    background:linear-gradient(90deg,#38bdf8,#818cf8);
    border-radius:999px;
    animation:load 1.6s infinite ease-in-out;
}

@keyframes load{
    0%{transform:translateX(-120%);}
    100%{transform:translateX(260%);}
}

@media (max-width:480px){
    .box{
        padding:32px 22px;
        border-radius:18px;
    }

    p{
        font-size:15px;
    }

    .logo{
        height:50px;
    }
}
</style>
</head>

<body>

<div class="box">
    <img class="logo" src="logo.png" alt="Venus">

    <p>
        Venus se encuentra en fase de construcción y mejora.
    </p>

    <div class="loader">
        <span></span>
    </div>

    <div class="date">
        Fecha estimada de lanzamiento: <strong>01 / 05 / 2026</strong>
    </div>
</div>

</body>
</html>
